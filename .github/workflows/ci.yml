name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "apps/backend/pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check code formatting
        run: uv run black --check .

      - name: Lint codebase
        run: uv run ruff check .

      - name: Validate static types
        run: uv run mypy .

      - name: Run test suite
        run: uv run pytest
